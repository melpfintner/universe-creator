#:schema node_modules/wrangler/config-schema.json
name = "universe-creator-interface"
compatibility_date = "2026-11-02"

# Define que o Cloudflare deve servir a pasta de build gerada pelo Vite
[assets]
directory = "./dist"
binding = "ASSETS"

# Configuração para que todas as rotas do painel lateral funcionem sem erro 404 ao atualizar a página
[site]
bucket = "./dist"
entry-point = "workers-site"
